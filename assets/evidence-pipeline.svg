<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">护肤品选品证据链流程图</title>
  <desc id="desc">从用户问题到 NMPA 备案、官方价格、成分位置和购买结论的证据流程。</desc>
  <defs>
    <style>
      .bg { fill: #fbfaf7; }
      .title { font: 700 44px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #24312f; }
      .subtitle { font: 400 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #60716d; }
      .box-title { font: 700 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #17332d; }
      .box-text { font: 400 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #465955; }
      .tag { font: 700 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #fff; }
      .card { fill: #ffffff; stroke: #d9e3df; stroke-width: 2; rx: 18; }
      .accent { fill: #0e7c66; }
      .soft { fill: #e7f3ef; }
      .warn { fill: #fff3d8; stroke: #efd28c; stroke-width: 2; rx: 18; }
      .arrow { stroke: #0e7c66; stroke-width: 4; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0e7c66"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="760"/>
  <text class="title" x="84" y="86">护肤品推荐不是“种草”，是证据链</text>
  <text class="subtitle" x="86" y="124">先确认版本和备案，再判断成分位置与肤质适配，最后才给购买建议。</text>

  <rect class="card" x="72" y="190" width="220" height="144"/>
  <rect class="accent" x="96" y="214" width="70" height="30" rx="15"/>
  <text class="tag" x="114" y="236">STEP 1</text>
  <text class="box-title" x="96" y="276">用户需求</text>
  <text class="box-text" x="96" y="306">肤质、预算、诉求</text>
  <text class="box-text" x="96" y="332">候选产品或品类</text>

  <path class="arrow" d="M300 262 H390"/>
  <rect class="card" x="408" y="190" width="220" height="144"/>
  <rect class="accent" x="432" y="214" width="70" height="30" rx="15"/>
  <text class="tag" x="450" y="236">STEP 2</text>
  <text class="box-title" x="432" y="276">备案/版本</text>
  <text class="box-text" x="432" y="306">包装或商品页找编号</text>
  <text class="box-text" x="432" y="332">NMPA 路由查询</text>

  <path class="arrow" d="M636 262 H726"/>
  <rect class="card" x="744" y="190" width="220" height="144"/>
  <rect class="accent" x="768" y="214" width="70" height="30" rx="15"/>
  <text class="tag" x="786" y="236">STEP 3</text>
  <text class="box-title" x="768" y="276">成分位置</text>
  <text class="box-text" x="768" y="306">前段 / 中段 / 尾段</text>
  <text class="box-text" x="768" y="332">微量成分单独标注</text>

  <path class="arrow" d="M972 262 H1062"/>
  <rect class="card" x="1080" y="190" width="220" height="144"/>
  <rect class="accent" x="1104" y="214" width="70" height="30" rx="15"/>
  <text class="tag" x="1122" y="236">STEP 4</text>
  <text class="box-title" x="1104" y="276">价格渠道</text>
  <text class="box-text" x="1104" y="306">官方商城 / 天猫</text>
  <text class="box-text" x="1104" y="332">京东 / 抖音 / 小红书</text>

  <rect class="soft" x="168" y="432" width="480" height="164" rx="22"/>
  <text class="box-title" x="200" y="482">最终输出</text>
  <text class="box-text" x="200" y="518">优先买 / 可买但有条件 / 不优先 / 避开</text>
  <text class="box-text" x="200" y="550">每个结论都带来源、版本、风险和使用建议</text>

  <rect class="warn" x="792" y="432" width="480" height="164"/>
  <text class="box-title" x="824" y="482">硬边界</text>
  <text class="box-text" x="824" y="518">不引用小导购站做价格依据</text>
  <text class="box-text" x="824" y="550">不把“含有明星成分”直接当有效</text>

  <path class="arrow" d="M1190 344 C1190 400 1060 396 1032 432"/>
  <path class="arrow" d="M854 344 C854 400 626 396 566 432"/>
</svg>
